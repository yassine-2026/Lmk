<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0a0a0a',
                        cardbg: '#1a1a2e',
                        cardborder: '#2a2a4a',
                        primary: '#6366f1',
                        accent: '#a855f7'
                    },
                    fontFamily: {
                        sans: ['system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background: linear-gradient(to bottom right, #0a0a0a, #1a1a2e); color: #fff; min-height: 100vh; }
        .gradient-text {
            background: linear-gradient(to right, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gradient-btn {
            background: linear-gradient(to right, #6366f1, #a855f7);
            transition: all 0.3s ease;
        }
        .gradient-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(99, 102, 241, 0.5);
        }
        .loading-spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #a855f7;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .progress-bar-container {
            width: 100%;
            background-color: #2a2a4a;
            border-radius: 9999px;
            overflow: hidden;
            height: 8px;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(to right, #6366f1, #a855f7);
            width: 0%;
            transition: width 0.5s ease;
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-bold mb-4">صانع الفيديوهات <span class="gradient-text">بالذكاء الاصطناعي</span></h1>
            <p class="text-gray-400">أنشئ فيديوهات احترافية مع تعليق صوتي ومقاطع فيديو وموسيقى في ثوانٍ</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- Form -->
            <div class="lg:col-span-5 bg-cardbg p-6 rounded-2xl border border-cardborder shadow-xl h-fit">
                <form id="videoForm" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium mb-2">موضوع الفيديو</label>
                        <textarea id="topic" rows="3" class="w-full bg-darkbg border border-cardborder rounded-lg p-3 text-white focus:outline-none focus:border-primary" placeholder="مثال: أهمية الذكاء الاصطناعي في التعليم..." required></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-2">مدة الفيديو (ثواني)</label>
                        <input type="range" id="duration" min="15" max="90" step="15" value="30" class="w-full accent-primary" oninput="document.getElementById('durationVal').innerText = this.value + 's'">
                        <div class="text-center text-sm text-gray-400 mt-1" id="durationVal">30s</div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-2">أسلوب الطرح</label>
                            <select id="tone" class="w-full bg-darkbg border border-cardborder rounded-lg p-3 text-white focus:outline-none focus:border-primary">
                                <option value="احترافي">احترافي</option>
                                <option value="حماسي">حماسي</option>
                                <option value="هادئ">هادئ</option>
                                <option value="فكاهي">فكاهي</option>
                                <option value="تعليمي">تعليمي</option>
                                <option value="تسويقي">تسويقي</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">الموسيقى</label>
                            <select id="music" class="w-full bg-darkbg border border-cardborder rounded-lg p-3 text-white focus:outline-none focus:border-primary">
                                <option value="حماسي">حماسي</option>
                                <option value="هادئ">هادئ</option>
                                <option value="درامي">درامي</option>
                                <option value="مرح">مرح</option>
                                <option value="ملحمي">ملحمي</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-2">الصوت (Voiceover)</label>
                        <select id="voice" class="w-full bg-darkbg border border-cardborder rounded-lg p-3 text-white focus:outline-none focus:border-primary">
                            <option value="arabic_male">ذكر عربي (Hamed)</option>
                            <option value="arabic_female">أنثى عربي (Zariyah)</option>
                            <option value="english_male">English Male (Guy)</option>
                            <option value="english_female">English Female (Jenny)</option>
                            <option value="cartoon">كرطوني (Ana)</option>
                        </select>
                    </div>

                    <button type="submit" id="generateBtn" class="w-full gradient-btn font-bold py-3 px-4 rounded-lg flex items-center justify-center gap-2">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        <span>توليد الفيديو</span>
                    </button>
                    
                    <div id="loadingIndicator" class="hidden flex-col items-center justify-center mt-4">
                        <p class="text-sm text-gray-400 mb-2" id="loadingText">جاري كتابة السكريبت...</p>
                        <div class="progress-bar-container">
                            <div class="progress-bar" id="progressBar"></div>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Results -->
            <div class="lg:col-span-7 space-y-6">
                <div id="emptyState" class="bg-cardbg border border-cardborder rounded-2xl p-12 text-center h-full flex flex-col justify-center items-center">
                    <i class="fa-solid fa-film text-6xl text-gray-600 mb-4"></i>
                    <h3 class="text-xl font-bold mb-2">النتائج ستظهر هنا</h3>
                    <p class="text-gray-400">املأ النموذج واضغط على توليد لرؤية سحر الذكاء الاصطناعي.</p>
                </div>

                <div id="resultsState" class="hidden space-y-6">
                    
                    <div class="bg-cardbg border border-cardborder rounded-2xl p-4 flex gap-4 overflow-x-auto">
                        <div class="flex-1 bg-darkbg p-3 rounded-xl border border-cardborder text-center">
                            <i class="fa-solid fa-microphone text-primary mb-2"></i>
                            <h4 class="text-sm font-bold mb-2">التعليق الصوتي</h4>
                            <audio id="voicePlayer" controls class="w-full h-8"></audio>
                        </div>
                        <div class="flex-1 bg-darkbg p-3 rounded-xl border border-cardborder text-center">
                            <i class="fa-solid fa-music text-accent mb-2"></i>
                            <h4 class="text-sm font-bold mb-2">الموسيقى الخلفية</h4>
                            <audio id="musicPlayer" controls class="w-full h-8"></audio>
                        </div>
                    </div>

                    <div class="bg-cardbg border border-cardborder rounded-2xl p-6">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-bold text-lg"><i class="fa-solid fa-list text-primary"></i> المشاهد</h3>
                            <button onclick="copyScript()" class="text-sm bg-darkbg px-3 py-1 rounded hover:bg-gray-800 border border-cardborder transition">
                                <i class="fa-regular fa-copy"></i> نسخ النص
                            </button>
                        </div>
                        <div id="scenesContainer" class="space-y-4">
                            <!-- Scenes injected here -->
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-4 right-4 bg-red-500/10 border border-red-500 text-red-500 px-6 py-3 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50">
        <span id="toastMsg">خطأ</span>
    </div>

    <script>
        let fullScriptText = "";

        document.getElementById('videoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('generateBtn');
            const loading = document.getElementById('loadingIndicator');
            const progressBar = document.getElementById('progressBar');
            const loadingText = document.getElementById('loadingText');
            const resultsState = document.getElementById('resultsState');
            const emptyState = document.getElementById('emptyState');
            
            btn.disabled = true;
            btn.classList.add('opacity-50');
            loading.classList.remove('hidden');
            loading.classList.add('flex');
            resultsState.classList.add('hidden');
            emptyState.classList.add('hidden');
            
            // Fake progress
            let progress = 0;
            const progressInterval = setInterval(() => {
                progress += 5;
                if (progress <= 90) {
                    progressBar.style.width = progress + '%';
                    if (progress === 30) loadingText.innerText = "جاري جلب الفيديوهات من Pexels...";
                    if (progress === 60) loadingText.innerText = "جاري توليد الصوت بـ Edge-TTS...";
                    if (progress === 80) loadingText.innerText = "جاري دمج الملفات...";
                }
            }, 500);

            try {
                const payload = {
                    topic: document.getElementById('topic').value,
                    duration: document.getElementById('duration').value,
                    tone: document.getElementById('tone').value,
                    music: document.getElementById('music').value,
                    voice: document.getElementById('voice').value,
                    language: 'arabic'
                };

                const res = await fetch('/api/generate-video', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                clearInterval(progressInterval);
                progressBar.style.width = '100%';
                
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error || 'حدث خطأ في الخادم');
                }

                const data = await res.json();
                renderResults(data);
                
            } catch (err) {
                clearInterval(progressInterval);
                showToast(err.message);
                emptyState.classList.remove('hidden');
            } finally {
                setTimeout(() => {
                    btn.disabled = false;
                    btn.classList.remove('opacity-50');
                    loading.classList.add('hidden');
                    loading.classList.remove('flex');
                    progressBar.style.width = '0%';
                }, 500);
            }
        });

        function renderResults(data) {
            document.getElementById('resultsState').classList.remove('hidden');
            
            const vp = document.getElementById('voicePlayer');
            const mp = document.getElementById('musicPlayer');
            
            if(data.voice_url) {
                vp.src = data.voice_url;
            } else if (data.voice_file) {
                vp.src = '/' + data.voice_file;
            }
            if(data.music_url) {
                mp.src = data.music_url;
            }

            const container = document.getElementById('scenesContainer');
            container.innerHTML = '';
            fullScriptText = data.script;

            if (data.scenes && data.scenes.length > 0) {
                data.scenes.forEach((scene, i) => {
                    let videoHtml = '<div class="w-full h-32 bg-gray-800 rounded flex items-center justify-center text-gray-500 text-xs">لا يوجد فيديو مقترح</div>';
                    if (scene.videos && scene.videos.length > 0) {
                        const vid = scene.videos[0];
                        videoHtml = `
                            <div class="relative w-full h-32 rounded overflow-hidden group cursor-pointer" onclick="window.open('${vid.url}', '_blank')">
                                <img src="${vid.image || ''}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/300x200?text=Video+Thumbnail'" />
                                <div class="absolute inset-0 bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                                    <i class="fa-solid fa-play text-white text-2xl"></i>
                                </div>
                                <div class="absolute bottom-1 right-1 bg-black/70 text-xs px-1 rounded">${vid.duration}s</div>
                            </div>
                        `;
                    }

                    container.innerHTML += `
                        <div class="bg-darkbg border border-cardborder rounded-xl p-4 grid grid-cols-1 md:grid-cols-4 gap-4 items-center">
                            <div class="md:col-span-1">
                                ${videoHtml}
                                <div class="text-center mt-2">
                                    <span class="text-xs bg-primary/20 text-primary px-2 py-1 rounded font-mono">${scene.start_time} - ${scene.end_time}s</span>
                                </div>
                            </div>
                            <div class="md:col-span-3 space-y-2 text-sm">
                                <p><span class="text-gray-400">الوصف البصري:</span> ${scene.visual}</p>
                                <p><span class="text-gray-400">النص على الشاشة:</span> <span class="text-accent font-bold">${scene.text_on_screen}</span></p>
                                <p class="bg-cardbg p-2 rounded border border-cardborder"><span class="text-primary"><i class="fa-solid fa-microphone"></i> التعليق:</span> ${scene.voiceover}</p>
                            </div>
                        </div>
                    `;
                });
            } else {
                container.innerHTML = `<pre class="whitespace-pre-wrap text-sm text-gray-300 font-mono bg-darkbg p-4 rounded">${data.script}</pre>`;
            }
        }

        function showToast(msg, type = 'error') {
            const toast = document.getElementById('toast');
            toast.className = `fixed bottom-4 right-4 ${type === 'error' ? 'bg-red-500/10 border-red-500 text-red-500' : 'bg-green-500/10 border-green-500 text-green-500'} border px-6 py-3 rounded-lg shadow-lg transition-all duration-300 z-50 transform translate-y-0 opacity-100`;
            document.getElementById('toastMsg').innerText = msg;
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function copyScript() {
            if(fullScriptText) {
                navigator.clipboard.writeText(fullScriptText).then(() => showToast('تم نسخ النص', 'success'));
            }
        }
    </script>
</body>
</html>
